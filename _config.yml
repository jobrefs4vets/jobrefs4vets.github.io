title: Minimalist Job Board
email: jobs@example.com
description: A clean, grey-outline job board built with Jekyll and Google JobPosting schema.
baseurl: ""
url: "https://jobrefs4vets.github.io"
markdown: kramdown
theme: minima
plugins: []
# GitHub Pages-safe configuration
collections:
  jobs:
    output: true
    permalink: /jobs/:name/
defaults:
  - scope:
      path: ""
      type: "jobs"
    values:
      layout: job
      permalink: /jobs/:name/
      published: true

# Minimal navigation links
nav_links:
  - title: Home
    url: /
  - title: Contact
    url: /contact/
