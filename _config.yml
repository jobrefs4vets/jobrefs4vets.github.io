title: JobRefs4Vets
email: shane@oxenith.com
description: Job opportunities for veterans and military-affiliated professionals.
baseurl: ""
url: "https://jobrefs4vets.github.io"
markdown: kramdown
theme: minima
plugins:
  - jekyll-sitemap
# GitHub Pages-safe configuration
collections:
  jobs:
    output: true
    permalink: /jobs/:name/
defaults:
  - scope:
      path: ""
      type: "jobs"
    values:
      layout: job
      permalink: /jobs/:name/
      published: true

# Minimal navigation links
nav_links:
  - title: Home
    url: /
  - title: Contact
    url: /contact/
